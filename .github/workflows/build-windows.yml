name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Run tests
        run: python -m pytest

      - name: Build EXE
        run: python -m PyInstaller --noconfirm --clean CIPA-Crop-Coord.spec

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: CIPA-Crop-Coord-Windows
          path: dist/CIPA-Crop-Coord.exe
          if-no-files-found: error
